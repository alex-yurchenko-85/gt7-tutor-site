name: Site problem
description: The landing page at gt7tutor.app does not show or work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the landing page only. Report a problem of the GT7 Tutor application in the main project: https://github.com/alex-yurchenko-85/gt7-tutor/issues
  - type: input
    id: page
    attributes:
      label: Page address
      description: For example https://gt7tutor.app/
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example Safari on an iPhone, or Chrome on a computer.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Text
        - Images
        - Links
        - Layout
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What occurred. Add a screenshot if you have one.
    validations:
      required: true
